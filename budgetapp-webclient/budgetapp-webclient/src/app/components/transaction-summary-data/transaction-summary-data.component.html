<div class="details-container mat-elevation-z8">
  <div class="details-header">
    <div class="spinner-container" *ngIf="dataSourceData.loading$ | async">
      <mat-spinner></mat-spinner>
    </div>

    <mat-table #table [dataSource]="dataSourceData">

      <!-- Date Column -->
      <ng-container matColumnDef="date">
        <mat-header-cell *matHeaderCellDef> Date </mat-header-cell>
        <mat-cell *matCellDef="let transactionSummary"> {{transactionSummary.dateStamp | date: "dd/MM/yyyy" }} </mat-cell>
      </ng-container>

      <!-- Type Column -->
      <ng-container matColumnDef="type">
        <mat-header-cell *matHeaderCellDef> Type </mat-header-cell>
        <mat-cell *matCellDef="let transactionSummary"> {{transactionSummary.transType}} </mat-cell>
      </ng-container>

      <!-- Description Column -->
      <ng-container matColumnDef="description">
        <mat-header-cell *matHeaderCellDef> Description </mat-header-cell>
        <mat-cell *matCellDef="let transactionSummary"> {{transactionSummary.description}} </mat-cell>
      </ng-container>

      <!-- Amount Column -->
      <ng-container matColumnDef="amount">
        <mat-header-cell *matHeaderCellDef> Amount </mat-header-cell>
        <mat-cell *matCellDef="let transactionSummary"> {{transactionSummary.amount | currency:'GBP'}} </mat-cell>
      </ng-container>

      <mat-header-row *matHeaderRowDef="displayedColumnsData"></mat-header-row>
      <mat-row *matRowDef="let row; columns: displayedColumnsData;"></mat-row>
    </mat-table>
  </div>
</div>
<div class="details-container mat-elevation-z8">
  <div class="details-header">
    <div class="spinner-container" *ngIf="dataSourceTotal.loading$ | async">
      <mat-spinner></mat-spinner>
    </div>

    <mat-table #table [dataSource]="dataSourceTotal">

      <!-- Total Column -->
      <ng-container matColumnDef="total">
        <mat-header-cell *matHeaderCellDef> Total </mat-header-cell>
        <mat-cell *matCellDef="let total"> {{total | currency:'GBP'}} </mat-cell>
      </ng-container>

      <mat-header-row *matHeaderRowDef="displayedColumnsTotal"></mat-header-row>
      <mat-row *matRowDef="let row; columns: displayedColumnsTotal;"></mat-row>
    </mat-table>
  </div>
</div>
